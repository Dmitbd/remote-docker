name: Release signed desktop packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  rootfs:
    name: Build verified rootfs input
    if: github.repository == 'Dmitbd/remote-docker' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build rootfs input
        run: bash packaging/wsl/build-rootfs.sh

      - name: Verify rootfs artifact
        run: bash tests/integration/rootfs_test.sh

      - name: Upload rootfs input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: release-rootfs
          path: |
            dist/remote-docker-rootfs.tar.zst
            dist/remote-docker-rootfs.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1

  windows-release:
    name: Sign and verify Windows package
    needs: rootfs
    if: github.repository == 'Dmitbd/remote-docker' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release context
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'Dmitbd/remote-docker') { throw 'Unexpected release repository.' }
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') { throw 'Release ref must start with refs/tags/v.' }
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Release tag must be vMAJOR.MINOR.PATCH.' }
          $tagObject = (git rev-parse "refs/tags/$($env:GITHUB_REF_NAME)").Trim()
          if ((git cat-file -t $tagObject).Trim() -ne 'tag') { throw 'Release tag must be an annotated signed tag.' }
          $tagVerification = gh api "repos/$($env:GITHUB_REPOSITORY)/git/tags/$tagObject" | ConvertFrom-Json
          if ($null -eq $tagVerification.verification -or -not $tagVerification.verification.verified) {
            throw 'GitHub did not verify the release tag signature.'
          }
          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF_NAME).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) { throw 'Checked out commit does not match the release tag.' }
          "RELEASE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download rootfs input
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact@v7
        with:
          name: release-rootfs
          path: dist

      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.0 -Scope CurrentUser -Force

      - name: Verify Windows package contract
        shell: pwsh
        run: Invoke-Pester -Path tests/integration/windows_package.Tests.ps1 -CI

      - name: Build unsigned Windows binaries
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -Version $env:RELEASE_VERSION -BuildBinariesOnly

      - name: Sign Windows binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Windows signing credentials are unavailable.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'remote-docker-signing.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $securePassword = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -Password $securePassword -CertStoreLocation Cert:\CurrentUser\My -Exportable
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) { throw 'Signing certificate import failed.' }
            $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw 'SignTool was not found.' }
            foreach ($file in Get-ChildItem -LiteralPath dist/windows/bin -Filter '*.exe' -File) {
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $certificate.Thumbprint $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($file.Name)." }
            }
          }
          finally {
            if ($null -ne $certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build MSI from signed binaries
        shell: pwsh
        run: >-
          ./packaging/windows/build-msi.ps1
          -Version $env:RELEASE_VERSION
          -RootfsPath dist/remote-docker-rootfs.tar.zst
          -BinaryInputDirectory dist/windows/bin

      - name: Sign MSI
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Windows signing credentials are unavailable.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'remote-docker-signing.pfx'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $securePassword = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -Password $securePassword -CertStoreLocation Cert:\CurrentUser\My -Exportable
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) { throw 'Signing certificate import failed.' }
            $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw 'SignTool was not found.' }
            $packages = @(Get-ChildItem -LiteralPath dist/windows -Filter '*.msi' -File)
            if ($packages.Count -ne 1) { throw "Expected exactly one MSI, found $($packages.Count)." }
            $msi = $packages[0]
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /sha1 $certificate.Thumbprint $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed.' }
          }
          finally {
            if ($null -ne $certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signatures and create signed release manifest
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -LiteralPath dist/windows/bin -Filter '*.exe' -File
            Get-ChildItem -LiteralPath dist/windows -Filter '*.msi' -File
          )
          $artifacts = foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Authenticode verification failed for $($file.Name)."
            }
            [ordered]@{
              name = $file.Name
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              signer_thumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
            }
          }
          [ordered]@{ version = $env:RELEASE_VERSION; artifacts = $artifacts } |
            ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath dist/windows/release-manifest.json -Encoding utf8NoBOM

      - name: Prepare release payload
        shell: pwsh
        run: |
          Copy-Item -LiteralPath dist/remote-docker-rootfs.tar.zst -Destination dist/windows/
          Copy-Item -LiteralPath dist/remote-docker-rootfs.tar.zst.sha256 -Destination dist/windows/

      - name: Create SBOM
        shell: pwsh
        run: >-
          go run github.com/anchore/syft/cmd/syft@v1.50.0
          scan dir:dist/windows
          -o cyclonedx-json=dist/windows/remote-docker-windows.cdx.json

      - name: Create release checksums
        shell: pwsh
        run: |
          $checksumFile = 'Remote-Docker-Windows-x64-SHA256SUMS'
          $releaseFiles = Get-ChildItem -LiteralPath dist/windows -Recurse -File | Where-Object Name -ne $checksumFile
          $lines = foreach ($file in $releaseFiles) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path dist/windows).Path, $file.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
          }
          $lines | Sort-Object | Set-Content -LiteralPath "dist/windows/$checksumFile" -Encoding ascii

      - name: Upload verified Windows release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: signed-windows-release
          path: dist/windows
          if-no-files-found: error
          retention-days: 1

  macos-release:
    name: Sign, notarize, and verify macOS package
    needs: rootfs
    if: github.repository == 'Dmitbd/remote-docker' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Dmitbd/remote-docker" ]]
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME")"
          [[ "$(git cat-file -t "$tag_object")" == "tag" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" == "true" ]]
          [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" == "$(git rev-parse HEAD)" ]]
          printf 'RELEASE_VERSION=%s\n' "${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"

      - name: Import signing identity and build notarized package
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          REMOTE_DOCKER_APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
          REMOTE_DOCKER_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in MACOS_SIGNING_CERTIFICATE_BASE64 MACOS_SIGNING_CERTIFICATE_PASSWORD \
            REMOTE_DOCKER_APP_SIGN_IDENTITY REMOTE_DOCKER_INSTALLER_SIGN_IDENTITY \
            APPLE_NOTARY_ID APPLE_NOTARY_TEAM_ID APPLE_NOTARY_PASSWORD; do
            [[ -n "${!required:-}" ]] || { echo "Required macOS release credential is unavailable." >&2; exit 1; }
          done
          certificate_path="$RUNNER_TEMP/remote-docker-signing.p12"
          keychain_path="$RUNNER_TEMP/remote-docker-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          notary_profile="remote-docker-release-${GITHUB_RUN_ID}"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 -D >"$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          xcrun notarytool store-credentials "$notary_profile" \
            --keychain "$keychain_path" \
            --apple-id "$APPLE_NOTARY_ID" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD"
          REMOTE_DOCKER_VERSION="$RELEASE_VERSION" \
          REMOTE_DOCKER_NOTARY_KEYCHAIN_PROFILE="$notary_profile" \
            packaging/macos/build-pkg.sh --arch arm64 --output dist/macos

      - name: Verify signed and stapled macOS package
        run: |
          set -euo pipefail
          packages=(dist/macos/*.pkg)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          pkgutil --check-signature "${packages[0]}"
          xcrun stapler validate "${packages[0]}"
          spctl --assess --verbose=2 --type install "${packages[0]}"
          shasum -a 256 "${packages[0]}" >dist/macos/Remote-Docker-macOS-arm64-SHA256SUMS

      - name: Upload verified macOS release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: signed-macos-release
          path: dist/macos
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified release artifacts
    needs: [windows-release, macos-release]
    if: github.repository == 'Dmitbd/remote-docker' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact@v7
        with:
          name: signed-windows-release
          path: release/windows

      - name: Download verified macOS payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact@v7
        with:
          name: signed-macos-release
          path: release/macos

      - name: Publish one release from both verified payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release -type f -print0 | sort -z)
          [[ ${#artifacts[@]} -gt 0 ]]
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" --verify-tag --generate-notes
