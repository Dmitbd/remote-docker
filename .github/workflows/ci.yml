name: Desktop package CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'assets/icon/**'
      - 'cmd/remote-docker-desktop/**'
      - 'cmd/remote-docker-ui/**'
      - 'cmd/remote-docker-remote/**'
      - 'cmd/remote-docker/**'
      - 'cmd/remote-docker-ssh/**'
      - 'internal/**'
      - 'frontend/**'
      - 'packaging/macos/**'
      - 'packaging/windows/**'
      - 'packaging/wsl/**'
      - 'tools/iconbuild/**'
      - 'tests/e2e/**'
      - 'tests/integration/windows_package.Tests.ps1'
      - 'tests/integration/macos_package_test.sh'
      - 'tests/integration/rootfs_test.sh'
      - 'tests/integration/release_workflow_test.sh'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

env:
  REMOTE_DOCKER_VERSION: '0.2.7'

jobs:
  rootfs:
    name: Build package rootfs input
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify rootfs source contract
        run: bash tests/integration/rootfs_test.sh --source

      - name: Verify free release workflow contract
        run: bash tests/integration/release_workflow_test.sh

      - name: Build rootfs input
        run: bash packaging/wsl/build-rootfs.sh

      - name: Verify rootfs artifact contract
        run: sudo bash tests/integration/rootfs_test.sh

      - name: Upload rootfs input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: remote-docker-rootfs
          path: |
            dist/remote-docker-rootfs.tar.zst
            dist/remote-docker-rootfs.tar.zst.sha256
          if-no-files-found: error
          retention-days: 3

  windows-package:
    name: Test and build unsigned Windows package
    needs: rootfs
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download rootfs input
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact@v7
        with:
          name: remote-docker-rootfs
          path: dist

      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.0.0 -Scope CurrentUser -Force

      - name: Verify focused Windows provisioning package
        run: go test ./internal/provision

      - name: Verify Windows PowerShell 5.1 path compatibility
        shell: powershell
        run: |
          . (Resolve-Path 'packaging\windows\scripts\path-validation.ps1')
          if (-not (Test-RemoteDockerFullyQualifiedPath -Path 'C:\Remote Docker')) {
            throw 'A normal absolute drive path must be accepted.'
          }
          foreach ($invalidPath in @('relative\path', 'C:relative', '\current-drive')) {
            if (Test-RemoteDockerFullyQualifiedPath -Path $invalidPath) {
              throw "Non-qualified path was accepted: '$invalidPath'."
            }
          }
          $canonical = Assert-RemoteDockerCanonicalPath -Path 'C:\Remote Docker' -Description 'Test path'
          if ($canonical -ne 'C:\Remote Docker') {
            throw "Unexpected canonical path '$canonical'."
          }

      - name: Verify Windows package contract
        shell: pwsh
        run: Invoke-Pester -Path tests/integration/windows_package.Tests.ps1 -CI

      - name: Build unsigned development Setup EXE
        shell: pwsh
        run: >-
          ./packaging/windows/build-installer.ps1
          -Version $env:REMOTE_DOCKER_VERSION
          -RootfsPath dist/remote-docker-rootfs.tar.zst

      - name: Confirm the development installer is unsigned
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath "dist/windows/Remote-Docker-$env:REMOTE_DOCKER_VERSION-x64-Setup.exe"
          $legacyPackages = @(Get-ChildItem -LiteralPath dist/windows -Recurse -File -Include '*.msi')
          if ($legacyPackages.Count -ne 0) { throw 'Legacy MSI output must not be produced.' }
          if ((Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status -ne 'NotSigned') {
            throw "Development installer must be unsigned: $($installer.Name)"
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath dist/windows/Remote-Docker-Windows-x64-SHA256SUMS -Encoding ascii

      - name: Upload unsigned development package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: remote-docker-windows-unsigned
          path: dist/windows
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Test and build unsigned macOS package
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify macOS package contract
        run: bash tests/integration/macos_package_test.sh

      - name: Build unsigned development package
        run: >-
          REMOTE_DOCKER_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          packaging/macos/build-pkg.sh
          --arch arm64
          --output dist/macos

      - name: Verify unsigned package and create checksum
        run: |
          set -euo pipefail
          packages=(dist/macos/*.pkg)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]]
          packaging/macos/inspect-pkg.sh "${packages[0]}"
          if pkgutil --check-signature "${packages[0]}" >dist/macos/signature-status.txt 2>&1; then
            echo 'Development package must remain unsigned.' >&2
            exit 1
          fi
          grep -F 'Status: no signature' dist/macos/signature-status.txt >/dev/null
          package_name="$(basename "${packages[0]}")"
          package_hash="$(shasum -a 256 "${packages[0]}" | awk '{print $1}')"
          printf '%s  %s\n' "$package_hash" "$package_name" >dist/macos/Remote-Docker-macOS-arm64-SHA256SUMS

      - name: Upload unsigned macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: remote-docker-macos-unsigned
          path: dist/macos
          if-no-files-found: error
          retention-days: 7
