[Service]
RuntimeDirectory=remote-docker
RuntimeDirectoryMode=0700
ExecStartPre=/usr/bin/test -s /run/remote-docker/ssh_host_ed25519_key
ExecStartPost=/bin/sh -ec 'for attempt in $(seq 1 50); do if ssh-keyscan -p 22 127.0.0.1 >/dev/null 2>&1; then rm -f /run/remote-docker/ssh_host_ed25519_key; exit 0; fi; sleep 0.1; done; exit 1'
